spring.application.name=techback

# Erros
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Banco (PostgreSQL) - variáveis de ambiente obrigatórias
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Schema gerenciado pelo Flyway; Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.h2.console.enabled=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}

# Admin inicial (criado na 1ª subida se ADMIN_PASSWORD estiver definido)
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:}
